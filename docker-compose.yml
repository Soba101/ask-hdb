# Simulated hosting: the same image you would deploy, run locally.
# The model is reached over the network, never inside the container: by default the Ollama on this machine (LOCAL_LLM_URL).
# For a hosted model put LLM_PROVIDER, LLM_MODEL and LLM_API_KEY in .env (never in this file).
services:
  app:
    build:
      context: .
      args:
        # 1 installs the optional Langfuse package (the LANGFUSE_* keys in .env still switch tracing on).
        TRACING: ${TRACING:-0}
    image: ask-hdb:local
    ports:
      # Loopback by default; set BIND_ADDR in .env to your LAN address to share it on your network only.
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Only the local-model default points at the host; a hosted provider ignores it, so its API key never goes to port 11434.
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://host.docker.internal:11434/v1}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-420}
      API_RATE_PER_MINUTE: ${API_RATE_PER_MINUTE:-6}
      API_DAILY_TOKEN_CAP: ${API_DAILY_TOKEN_CAP:-2000000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
