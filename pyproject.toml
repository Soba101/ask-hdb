[project]
name = "ask-hdb"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Soba", email = "57602047+Soba101@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.0",
    "httpx>=0.28.1",
    "langchain-anthropic",
    "langchain-google-genai>=4.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai",
    "langgraph",
    "mcp>=1.30.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.1",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
ask-hdb = "ask_hdb:main"

[project.optional-dependencies]
tracing = [
    "langfuse>=5.0.4",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
